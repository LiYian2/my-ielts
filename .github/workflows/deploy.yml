name: Verify and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && 'production' || format('verification-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.6.10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Wrangler version
        run: pnpm exec wrangler --version

      - name: Verify
        run: pnpm check

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name my-ielts
          --branch master
          --commit-hash "${GITHUB_SHA}"
          --commit-message "${GITHUB_COMMIT_MESSAGE}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event_name }}
